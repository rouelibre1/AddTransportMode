<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Séquences Panoramax sans mode de transport</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Séquences Panoramax sans <code>transport=</code></h1>
    <p>Liste les séquences d'un territoire dont le mode de transport n'est pas renseigné.</p>
  </header>

  <main>
    <section id="form-panel" class="panel">
      <form id="search-form" autocomplete="off">
        <div class="field">
          <label for="api-select">Source</label>
          <select id="api-select">
            <option value="https://api.panoramax.xyz/api" selected>Toutes les instances (api.panoramax.xyz)</option>
            <option value="https://panoramax.openstreetmap.fr/api">OpenStreetMap France (panoramax.openstreetmap.fr)</option>
            <option value="https://panoramax.ign.fr/api">IGN (panoramax.ign.fr)</option>
            <option value="custom">Autre instance…</option>
          </select>
          <input type="url" id="api-custom" placeholder="https://mon-instance.fr/api" hidden>
        </div>

        <div class="field">
          <label for="territory-type">Type de territoire</label>
          <select id="territory-type">
            <option value="commune" selected>Commune</option>
            <option value="epci">EPCI (intercommunalité)</option>
            <option value="map">Emprise visible de la carte</option>
          </select>
        </div>

        <div class="field" id="territory-search-field">
          <label for="territory-search">Territoire</label>
          <div class="autocomplete">
            <input type="search" id="territory-search" placeholder="Nom, code INSEE, code postal ou SIREN">
            <ul id="territory-suggestions" class="suggestions" hidden></ul>
          </div>
          <div id="territory-selected" class="selected-territory"></div>
        </div>

        <div class="field checkbox">
          <input type="checkbox" id="precise-check" checked>
          <label for="precise-check">Vérification précise avec le contour du territoire (plus lent)</label>
        </div>

        <div class="buttons">
          <button type="submit" id="search-btn">Rechercher</button>
          <button type="button" id="cancel-btn" hidden>Annuler</button>
        </div>
        <div id="status" role="status" aria-live="polite"></div>
      </form>
    </section>

    <section id="map-panel" class="panel">
      <div id="map"></div>
    </section>

    <section id="results-panel" class="panel" hidden>
      <div class="results-toolbar">
        <div class="field inline">
          <label for="min-images">Images min.</label>
          <input type="number" id="min-images" min="0" step="1" placeholder="—">
        </div>
        <div class="field inline">
          <label for="max-images">Images max.</label>
          <input type="number" id="max-images" min="0" step="1" placeholder="—">
        </div>
        <div class="field inline">
          <label for="sort-order">Tri par nombre d'images</label>
          <select id="sort-order">
            <option value="desc" selected>Décroissant</option>
            <option value="asc">Croissant</option>
          </select>
        </div>
      </div>
      <p id="summary"></p>
      <div class="table-wrapper">
        <table id="results-table">
          <thead>
            <tr>
              <th><button type="button" id="sort-header" class="sort-header">Images <span id="sort-indicator">▼</span></button></th>
              <th>Séquence</th>
              <th>Prise de vue</th>
              <th>Contributeur</th>
              <th>Tags existants</th>
              <th>Instance</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
